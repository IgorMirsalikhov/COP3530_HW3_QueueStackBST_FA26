# ─────────────────────────────────────────────────────────────────────
# CS++ Autograding Workflow — generated by the CS++ test builder.
# https://csplusplus.com/github · https://csplusplus.com/help/github-autograder
#
# CS++ installs this file at .github/workflows/classroom.yml in each
# student repo. Every push runs the tests below on GitHub Actions; the
# reporter publishes the score CS++ reads back into the gradebook, and
# the summary step renders a results table on the run's Summary tab.
# ─────────────────────────────────────────────────────────────────────
name: CS++ Autograding Tests
on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !endsWith(github.actor, '[bot]')
    steps:
      - name: Check out student code
        uses: actions/checkout@v4

      - name: 'p1_success'
        id: p1-success
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: 'p1_success'
          setup-command: ''
          command: 'g++ ./p1/testSimulation.cpp && ./a.out'
          input: '7'
          expected-output: 'All students were able to eat'
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: 'p1_print'
        id: p1-print
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: 'p1_print'
          setup-command: ''
          command: 'g++ ./p1/testSimulation.cpp && ./a.out'
          input: '5'
          expected-output: "Students came to caffeteria\nStud: [ 1, 0, 0, 0, 1, 0, 0, 0, 0, 0 ]\nSndw: [ 0, 0, 0, 0, 0, 1, 1, 0, 0, 1 ]"
          comparison-method: contains
          timeout: 10
          max-score: 10

      - name: 'p1_dont_take'
        id: p1-dont-take
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: 'p1_dont_take'
          setup-command: ''
          command: 'g++ ./p1/testSimulation.cpp && ./a.out'
          input: '1'
          expected-output: "First student doesn't take sandwich and goes to the end of the line\nStud: [ 1, 0, 0, 1 ]\nSndw: [ 0, 1, 1, 0 ]"
          comparison-method: contains
          timeout: 10
          max-score: 5

      - name: 'p1_fail'
        id: p1-fail
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: 'p1_fail'
          setup-command: ''
          command: 'g++ ./p1/testSimulation.cpp && ./a.out'
          input: '4'
          expected-output: '1 student(s) was/were NOT able to eat'
          comparison-method: contains
          timeout: 10
          max-score: 5

      - name: 'p2_empty'
        id: p2-empty
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: 'p2_empty'
          setup-command: 'cp ./test/mainBST.cpp ./p2'
          command: 'g++ ./p2/mainBST.cpp && ./a.out'
          input: ''
          expected-output: "Empty int tree:\nPreorder: [ ]\nPostorder: [ ]\nHeight: 0\nLeaf count: 0"
          comparison-method: contains
          timeout: 10
          max-score: 20

      - name: 'p2_one_node'
        id: p2-one-node
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: 'p2_one_node'
          setup-command: 'cp ./test/mainBST.cpp ./p2'
          command: 'g++ ./p2/mainBST.cpp && ./a.out'
          input: ''
          expected-output: "Single-node double tree:\nPreorder: [ 10.5 ]\nPostorder: [ 10.5 ]\nHeight: 1\nLeaf count: 1"
          comparison-method: contains
          timeout: 10
          max-score: 20

      - name: 'p2_multiple_nodes'
        id: p2-multiple-nodes
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: 'p2_multiple_nodes'
          setup-command: 'cp ./test/mainBST.cpp ./p2'
          command: 'g++ ./p2/mainBST.cpp && ./a.out'
          input: ''
          expected-output: "String tree:\nInorder: [ Apple Banana Mango Orange Peach Zebra ]\nPreorder: [ Mango Apple Banana Peach Orange Zebra ]\nPostorder: [ Banana Apple Orange Zebra Peach Mango ]\nHeight: 3\nLeaf count: 3"
          comparison-method: contains
          timeout: 10
          max-score: 20

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          P1-SUCCESS_RESULTS: "${{steps.p1-success.outputs.result}}"
          P1-PRINT_RESULTS: "${{steps.p1-print.outputs.result}}"
          P1-DONT-TAKE_RESULTS: "${{steps.p1-dont-take.outputs.result}}"
          P1-FAIL_RESULTS: "${{steps.p1-fail.outputs.result}}"
          P2-EMPTY_RESULTS: "${{steps.p2-empty.outputs.result}}"
          P2-ONE-NODE_RESULTS: "${{steps.p2-one-node.outputs.result}}"
          P2-MULTIPLE-NODES_RESULTS: "${{steps.p2-multiple-nodes.outputs.result}}"
        with:
          runners: p1-success,p1-print,p1-dont-take,p1-fail,p2-empty,p2-one-node,p2-multiple-nodes

      - name: CS++ Results Summary
        if: always()
        env:
          P1-SUCCESS_RESULTS: "${{steps.p1-success.outputs.result}}"
          P1-PRINT_RESULTS: "${{steps.p1-print.outputs.result}}"
          P1-DONT-TAKE_RESULTS: "${{steps.p1-dont-take.outputs.result}}"
          P1-FAIL_RESULTS: "${{steps.p1-fail.outputs.result}}"
          P2-EMPTY_RESULTS: "${{steps.p2-empty.outputs.result}}"
          P2-ONE-NODE_RESULTS: "${{steps.p2-one-node.outputs.result}}"
          P2-MULTIPLE-NODES_RESULTS: "${{steps.p2-multiple-nodes.outputs.result}}"
        run: |
          node <<'CSPP_SUMMARY'
          const fs = require('fs');
          const PASS = '\u2705', FAIL = '\u274c', WARN = '\u26a0\ufe0f';
          const fmt = (n) => (Math.round(n * 100) / 100).toString();
          const esc = (s) => String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\n/g, ' ');
          const keys = Object.keys(process.env).filter((k) => k.endsWith('_RESULTS')).sort();
          const rows = [];
          let earned = 0, possible = 0, passedCount = 0, testCount = 0;
          for (const key of keys) {
            const runner = key.slice(0, -8).toLowerCase();
            let data = null;
            try { data = JSON.parse(Buffer.from(process.env[key] || '', 'base64').toString('utf8')); } catch (e) {}
            if (!data || !Array.isArray(data.tests) || data.tests.length === 0) {
              rows.push('| ' + WARN + ' | `' + esc(runner) + '` | no result |');
              continue;
            }
            const max = Number(data.max_score) || 0;
            let rEarned = 0, rPassed = 0;
            for (const t of data.tests) {
              if (t.status === 'pass') rPassed += 1;
              rEarned += Number(t.score) || 0;
            }
            if (max > 0 && rEarned === 0 && rPassed > 0) {
              rEarned = (rPassed / data.tests.length) * max;
            }
            if (rEarned > max && max > 0) rEarned = max;
            earned += max > 0 ? rEarned : 0;
            possible += max;
            passedCount += rPassed;
            testCount += data.tests.length;
            if (data.tests.length === 1) {
              const t = data.tests[0];
              const icon = t.status === 'pass' ? PASS : FAIL;
              rows.push('| ' + icon + ' | ' + esc(t.name || runner) + ' | ' + (max > 0 ? fmt(rEarned) + ' / ' + fmt(max) : '\u2014') + ' |');
            } else {
              for (const t of data.tests) {
                rows.push('| ' + (t.status === 'pass' ? PASS : FAIL) + ' | ' + esc(t.name || runner) + ' | |');
              }
              rows.push('| ' + (rPassed === data.tests.length ? PASS : FAIL) + ' | **' + esc(runner) + ' subtotal** | ' + (max > 0 ? fmt(rEarned) + ' / ' + fmt(max) : '\u2014') + ' |');
            }
          }
          const md = [
            '## \ud83c\udf93 CS++ Autograder Results',
            '',
            '| | Test | Points |',
            '|---|---|---:|',
            ...rows,
            '',
            '**Total: ' + fmt(earned) + ' / ' + fmt(possible) + ' points** \u00b7 ' + passedCount + ' of ' + testCount + ' tests passed',
            '',
          ].concat(possible > 0 ? [] : [
            WARN + ' No points are configured, so no score reports to the CS++ gradebook.',
            '',
          ]).concat([
            'Scores sync automatically to the CS++ gradebook \u2014 per-test detail appears on your CS++ dashboard.',
            '',
            '_Autograded by [CS++ Classroom for GitHub](https://csplusplus.com/github)_',
            '',
          ]).join('\n');
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          }
          CSPP_SUMMARY
